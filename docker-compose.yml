version: '3.8'

services:
  neo4j:
    image: neo4j:5-community
    container_name: worldbuilder_neo4j
    ports:
      - "7475:7474"  # Neo4j Browser
      - "7688:7687"  # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/WorldBuilder2025!
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  backend:
    build: ./backend
    container_name: worldbuilder_backend
    ports:
      - "8000:8000"
    depends_on:
      - neo4j
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=WorldBuilder2025!
    volumes:
      - ./backend:/app
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: worldbuilder_frontend
    ports:
      - "3000:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000

volumes:
  neo4j_data:
  neo4j_logs: